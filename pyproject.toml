[project]
name = "video-automation"
version = "0.9.0"
description = "MCP対応 対話型動画編集自動化システム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "aiosqlite",
    "structlog",
    "mcp>=1.2,<2",
    "jsonschema>=4",
    "psd-tools>=1.10",  # 立ち絵の PSD を部品に分ける
    "numpy",
    "pillow",
]

[project.optional-dependencies]
ui = ["pyside6"]
transcribe = [
    "faster-whisper>=1.1",
]
transcribe-gpu = [
    "nvidia-cublas-cu12>=12.4,<12.9.3 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
video-automation = "video_automation.app.main:main"
video-automation-mcp = "video_automation.mcp_servers.core_server:main"
video-automation-mcp-media = "video_automation.mcp_servers.media_server:main"
video-automation-mcp-render = "video_automation.mcp_servers.render_server:main"
video-automation-mcp-visual = "video_automation.mcp_servers.visual_server:main"
video-automation-mcp-script = "video_automation.mcp_servers.script_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
exclude = ["integrations/blender/scripts/"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
