[project]
name = "video-automation"
version = "0.2.0"
description = "MCP対応 対話型動画編集自動化システム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "aiosqlite",
    "structlog",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
ui = ["pyside6"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
video-automation = "video_automation.app.main:main"
video-automation-mcp = "video_automation.mcp_servers.core_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
